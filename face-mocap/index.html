<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trikomi Face Mesh AR & Motion Capture</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <!-- Centered Stage Container matching Video Aspect Ratio -->
    <div class="stage-wrapper">
      <div id="stage-container">
        <!-- 3D Canvas Layer -->
        <div id="canvas-container"></div>

        <!-- Debug Mesh Overlay Canvas Layer -->
        <canvas id="debug-canvas"></canvas>

        <!-- Video Stream Layer -->
        <video id="webcam-video" autoplay playsinline muted></video>
      </div>
    </div>

    <!-- Top Left Header -->
    <div class="glass-panel header-overlay">
      <div>
        <h1 class="header-title">Trikomi</h1>
        <div class="header-subtitle">Face Mesh AR & Motion Capture</div>
      </div>
    </div>

    <!-- Right Controls Sidebar -->
    <div class="glass-panel controls-sidebar">
      <div class="section-title">Face Tracking Controls</div>

      <button id="toggle-grid-btn" class="btn-toggle">
        <span>Face Mesh Grid</span>
        <span id="grid-status-text">OFF</span>
      </button>

      <button id="toggle-occluder-btn" class="btn-toggle active">
        <span>Head Occluder Mesh</span>
        <span id="occluder-status-text">ON</span>
      </button>

      <div class="section-title" style="margin-top: 12px;">AR Makeup (Lipstick)</div>

      <button id="toggle-lipstick-btn" class="btn-toggle">
        <span>Lipstick Makeup</span>
        <span id="lipstick-status-text">OFF</span>
      </button>

      <div id="lipstick-color-wrap" style="display: flex; justify-content: space-between; align-items: center; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 8px;">
        <label style="font-size: 12px; color: #94a3b8; font-weight: 500;">Lipstick Shade</label>
        <input type="color" id="lipstick-color-picker" value="#ff0055" style="border: none; background: none; cursor: pointer; width: 32px; height: 32px;">
      </div>
    </div>

    <!-- Model Switcher Bar -->
    <div class="glass-panel model-switcher">
      <button id="prev-model-btn" class="model-btn" aria-label="Previous Avatar">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>

      <div id="model-name-display" class="model-name">
        Aviator Glasses
      </div>

      <button id="next-model-btn" class="model-btn" aria-label="Next Avatar">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
      <div style="width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <div>Loading Face Tracking & AI Models...</div>
    </div>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script type="module" src="./app.js"></script>
</body>
</html>
